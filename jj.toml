#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Nathan Moos"
email = "moosingin3space@gmail.com"

[fsmonitor]
backend = "watchman"

[ui]
editor = "hx"

[templates]
git_push_bookmark = '"moosnat/push-" ++ change_id.short()'

[aliases]
sl = ["log"]
gf = ["git", "fetch"]
nt = ["new", "trunk()"]
rt = ["rebase", "-d", "trunk()"]
rto = ["rt", "-r", "outstanding()"]
gfrto = ["util", "exec", "--", "bash", "-c", """
set -eo pipefail
jj gf && jj rto
"""]

[revset-aliases]
'outstanding()' = 'mine() & mutable()'
