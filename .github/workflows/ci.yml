name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  themes:
    name: Theme contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 tests/check_theme_contrast.py

  install:
    name: Install in an empty Homebrew container (including mise)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:latest
      options: --user=root
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run installer test as linuxbrew
        run: |
          chown -R linuxbrew:linuxbrew "$GITHUB_WORKSPACE"
          su --login --shell /bin/bash linuxbrew -c \
            "export PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:\$PATH; cd '$GITHUB_WORKSPACE' && bash tests/test-install.sh"

  herdr-plugins:
    name: herdr lazy plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/check-herdr-lazy-plugins.sh
