# Pin GeoClue to San Francisco instead of using inaccurate network/IP estimates.
# This applies system-wide to all applications that use GeoClue.

[ip]
enable=false

[network-nmea]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[wifi]
enable=false

[static-source]
enable=true
